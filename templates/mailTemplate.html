<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>{{title}}</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      line-height: 1.6;
      color: #333;
    }
    .container {
      max-width: 600px;
      margin: auto;
      background: #fff;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    .header {
      text-align: center;
      padding: 20px;
      background: #007bff;
      color: #fff;
    }
    .header h1 {
      margin: 0;
      font-size: 24px;
    }
    .blog-image {
      width: 100%;
      display: block;
    }
    .section {
      padding: 15px 20px;
      border-bottom: 1px solid #eee;
    }
    .section h2 {
      margin-top: 0;
    }
    .footer {
      background: #f9f9f9;
      text-align: center;
      padding: 15px;
      font-size: 12px;
      color: #666;
    }
    .footer a {
      color: #007bff;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>{{title}}</h1>
    </div>

    <!-- Blog Image -->
    <img src="{{blogImage}}" alt="Blog Image" class="blog-image" />

    <!-- Blog Sections -->
    {{sections}}

    <!-- Footer -->
    <div class="footer">
      <p>You’re receiving this email because you subscribed to BlogTech.</p>
      <p><a href="{{unsubscribe_link}}">Unsubscribe</a></p>
    </div>
  </div>
</body>
</html>
